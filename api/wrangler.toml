name = "qa-turgus-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "qa-turgus-db"
# Pakeiskite į savo DB id po `npx wrangler d1 create qa-turgus-db` (lokaliai tinka bet koks).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Kas naktį ištrinami seni testiniai vartotojai ir pasibaigusios sesijos.
[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true
