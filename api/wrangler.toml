name = "qa-turgus-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "qa-turgus-db"
# Gaunamas su `npx wrangler d1 create qa-turgus-db`.
database_id = "ad71c752-6655-410e-a586-ebee94a4a33a"
migrations_dir = "migrations"

# Kas naktį ištrinami seni testiniai vartotojai ir pasibaigusios sesijos.
[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true
